<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      First paint, before any bundled CSS exists. The background on `html` propagates to the canvas;
      `body` inherits, so the boot script below only has to recolour `html`. These are the default
      theme's --color-background/foreground, which is what the app's full-height container paints and
      so what fills the viewport; pinned against themeBoot.ts and index.css by the contract test.
    -->
    <style>
      html {
        background-color: #16181d;
        color: #e8eaf0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: inherit;
        color: inherit;
      }
    </style>
    <!--cove-theme-boot-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
